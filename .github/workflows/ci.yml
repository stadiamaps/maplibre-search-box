name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint scripts
        run: npm run lint:scripts

      - name: Lint styles
        run: npm run lint:styles

      # `npm test` starts vitest in watch mode outside CI; be explicit instead
      # of relying on its environment sniffing.
      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
